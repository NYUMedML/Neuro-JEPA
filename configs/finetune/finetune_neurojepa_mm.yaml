data:
  dataset_type: "3D-MRI"
  train_csv_path: /path/to/data/registration/SOOP/SOOP_gs-rankin_train.csv
  val_csv_path: /path/to/data/registration/SOOP/SOOP_gs-rankin_val.csv
  test_csv_path: /path/to/data/registration/SOOP/SOOP_gs-rankin_test.csv
  cache_dir: /path/to/cache/downstream_cache/temp_cache_register_SOOP_1mm_ls
  samples_per_epoch: 5000
  batch_size: 16
  img_size: [96, 108, 96]
  patch_size: [12, 12, 12]
  num_workers: 4
  pin_mem: true
  num_classes: 2
  img_cols:
    - t1w_path
    - flair_path
  all_cols:
    - t1w_path
    - t2w_path
    - flair_path
  label_col: gs_rankin_binary
  save_path: /path/to/downstream_pkl/test_preds.pkl
  use_foreground_mask: false
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: false
  load_path_checkpoint: /path/to/checkpoints/checkpoints_dir/latest.pt
  checkpoint_source: local
  hf_model_id: NYUMedML/Neuro-JEPA
  hf_revision: null
  hf_checkpoint_filename: null
  hf_checkpoint_key: null
  hf_cache_dir: null
  hf_token: true
  hf_subfolder: null
  checkpoint_strict: false
  save_path_checkpoint: /path/to/checkpoints/checkpoints_dir/
  read_checkpoint: null
  save_checkpoint_freq: 5
  seed: 42
  use_sdpa: true
  compile_model: false
model:
  model_name: "vit_avg"
  backbone_name: vit_base
  img_size: [96, 108, 96]
  patch_size: [12, 12, 12]
  in_chans: 1
  uniform_power: true
  use_activation_checkpointing: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  wide_silu: true
  use_moe: true
  freeze_backbone: false
  moe_params:
    moe_type: "bias"
    dim: 768
    n_shared_experts: 2
    n_routed_experts: 16
    n_activated_experts: 6
    moe_inter_dim: 384
    score_func: softmax
    route_scale: 4.0
    bias_update_rate: 0.0
    bias_update_rate_min: 0.0
    bias_update_rate_max: 0.0
    moe_layer_indices:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
optimization:
  is_anneal: False
  num_epochs: 15
  final_lr: 1.5e-8
  final_weight_decay: 0.01
  ipe: -1
  ipe_scale: 1.0
  lr: 1.5e-4
  start_lr: 1.5e-8
  warmup: 2
  weight_decay: 0.01
  lr_scale: 1.0
  mixed_precision: true
  betas:
  - 0.9
  - 0.999
  eps: 1e-08
log:
  filename: "finetune"
  output_dir: /path/to/Neuro-JEPA/cfg_settings/finetune
wandb:
  project: "Neuro-JEPA-finetune-MRI-T1w-Monitor"
  entity: "your-entity"
  wandb_enable: false
